<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Online Exam System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .login-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: var(--space-6); background: linear-gradient(135deg, var(--bg-primary) 0%, var(--color-100) 100%); }
    .login-card { width: 100%; max-width: 420px; background: var(--bg-secondary); border: 1px solid var(--border-light); border-radius: var(--radius-xl); box-shadow: var(--shadow-xl); padding: var(--space-8); }
    .login-header { text-align: center; margin-bottom: var(--space-8); }
    .login-logo { width: 56px; height: 56px; margin: 0 auto var(--space-5); background: linear-gradient(135deg, var(--color-primary), #6366f1); border-radius: var(--radius-lg); display: flex; align-items: center; justify-content: center; }
    .login-logo svg { width: 28px; height: 28px; color: var(--color-white); }
    .login-header h1 { font-size: var(--text-2xl); font-weight: var(--font-extrabold); color: var(--text-primary); margin-bottom: var(--space-2); letter-spacing: -0.02em; }
    .login-header p { color: var(--text-muted); font-size: var(--text-base); font-weight: var(--font-normal); }
    .form-group { margin-bottom: var(--space-5); }
    .form-group label { font-size: var(--text-sm); font-weight: var(--font-semibold); color: var(--text-secondary); margin-bottom: var(--space-2); text-transform: uppercase; letter-spacing: 0.04em; }
    .input-wrapper { position: relative; }
    .input-wrapper .icon { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--color-400); pointer-events: none; }
    .input-wrapper input { padding-left: 2.75rem; }
    .input-wrapper input:focus + .icon { color: var(--color-primary); }
    .btn-submit { width: 100%; padding: 0.875rem 1rem; font-size: var(--text-base); font-weight: var(--font-semibold); margin-top: var(--space-2); }
    .divider { display: flex; align-items: center; gap: var(--space-4); margin: var(--space-6) 0; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border-light); }
    .divider span { font-size: var(--text-xs); font-weight: var(--font-medium); color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; white-space: nowrap; }
    .signup-prompt { text-align: center; font-size: var(--text-sm); color: var(--text-muted); }
    .signup-prompt a { font-weight: var(--font-semibold); color: var(--color-primary); }
    .signup-prompt a:hover { color: var(--color-primary-hover); }
    .footer { margin-top: var(--space-10); padding-top: var(--space-6); border-top: 1px solid var(--border-light); text-align: center; color: var(--text-muted); font-size: var(--text-xs); }
    .footer strong { color: var(--text-primary); }
  </style>
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </div>
        <h1>Welcome Back</h1>
        <p>Sign in to your Online Exam account</p>
      </div>

      <div id="alertError" class="alert alert-danger" role="alert">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
        <span id="alertErrorText"></span>
        <button type="button" class="close" aria-label="Dismiss">&times;</button>
      </div>
      <div id="alertWarning" class="alert alert-warning" role="alert">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
        <span id="alertWarningText"></span>
        <button type="button" class="close" aria-label="Dismiss">&times;</button>
      </div>
      <div id="alertSuccess" class="alert alert-success" role="alert">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
        <span id="alertSuccessText"></span>
        <button type="button" class="close" aria-label="Dismiss">&times;</button>
      </div>

      <form action="/login" method="post" novalidate>
        <div class="form-group">
          <label for="username">Username</label>
          <div class="input-wrapper">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            <input type="text" id="username" name="username" placeholder="Enter your username" required autocomplete="username" autofocus>
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-lg btn-submit">Sign In</button>
      </form>

      <div class="divider"><span>Or</span></div>

      <p class="signup-prompt">Don't have an account? <a href="/signup">Create one</a></p>

      <footer class="footer">
        &copy; 2026 Online Exam System &mdash; Developed by <strong>BART</strong> | Crafted with &hearts; for Education<br>
        <small>All Rights Reserved &bull; Made in the Philippines &bull; v1.0</small>
      </footer>
    </div>
  </div>

  <script>
    const qs = new URLSearchParams(location.search);
    function show(id, textId, msg) {
      if (msg) {
        const el = document.getElementById(textId);
        const alertEl = document.getElementById(id);
        el.textContent = decodeURIComponent(msg.replace(/\+/g, ' '));
        alertEl.classList.add('show');
        setTimeout(() => alertEl.classList.remove('show'), 6000);
      }
    }
    show('alertError', 'alertErrorText', qs.get('error'));
    show('alertWarning', 'alertWarningText', qs.get('warning'));
    const suc = qs.get('success');
    if (suc) {
      document.getElementById('alertSuccessText').textContent = decodeURIComponent(suc.replace(/\+/g, ' '));
      document.getElementById('alertSuccess').classList.add('show');
    }
    document.querySelectorAll('.alert .close').forEach(btn => {
      btn.addEventListener('click', () => btn.closest('.alert').classList.remove('show'));
    });
  </script>
</body>
</html>
